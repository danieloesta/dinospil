<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Morgenjagt</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1115;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}canvas{width:100vw;height:100vh;display:block;touch-action:none}#start,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#10212f66,#071015dd);z-index:5}.p{width:min(430px,84vw);padding:24px;border:1px solid #ffffff22;border-radius:18px;background:#0d171ddd;backdrop-filter:blur(12px)}h1{margin:0 0 8px;font-size:31px}.sub{line-height:1.45;opacity:.85;margin-bottom:18px}button{width:100%;padding:15px 18px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#f1f0e9;color:#111}#end{display:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.s{background:#ffffff10;border-radius:10px;padding:12px}.s b{font-size:22px;display:block}.s span{font-size:11px;opacity:.7}#tip{position:fixed;left:12px;right:12px;bottom:10px;text-align:center;font-size:12px;background:#0008;padding:8px;border-radius:9px;z-index:4}@media(orientation:landscape){#tip{display:none}}</style></head><body><canvas id="g"></canvas><div id="tip">Vend gerne iPhone vandret</div><div id="start"><div class="p"><h1>Morgenjagt</h1><div class="sub">Skyd <b>10 ænder</b>. Du har to patroner ad gangen. Tryk direkte på anden for at skyde.</div><button id="go">Start jagten</button></div></div><div id="end"><div class="p"><h1>Jagten er slut</h1><div class="stats"><div class="s"><b id="es">0</b><span>SKUD</span></div><div class="s"><b id="ea">0%</b><span>TRÆFPROCENT</span></div><div class="s"><b id="et">00:00</b><span>TID</span></div><div class="s"><b>10/10</b><span>ÆNDER</span></div></div><button id="again">Spil igen</button></div></div><script>const c=document.getElementById('g'),x=c.getContext('2d'),start=document.getElementById('start'),end=document.getElementById('end');let W,H,D=1,ducks=[],parts=[],kills=0,shots=0,ammo=2,reload=false,playing=false,t0=0,last=0,aim={x:0,y:0},flash=0,shake=0;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(!aim.x){aim.x=W*.5;aim.y=H*.43}}addEventListener('resize',rs);rs();const R=(a,b)=>a+Math.random()*(b-a),T=m=>{let s=Math.floor(m/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function spawn(){let d=Math.random()<.5?1:-1,s=R(.75,1.2)*Math.min(W,H)/700;ducks.push({x:d>0?-80:W+80,y:R(H*.13,H*.55),vx:d*R(115,190),vy:R(-12,12),p:R(0,6.28),s,alive:1})}function reset(){ducks=[];parts=[];kills=shots=0;ammo=2;reload=false;playing=true;t0=performance.now();last=t0;for(let i=0;i<3;i++)spawn();end.style.display='none'}function bang(){try{let A=window.AudioContext||window.webkitAudioContext,a=bang.a||(bang.a=new A),n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.16,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.035));n.buffer=b;let g=a.createGain();g.gain.value=.22;n.connect(g).connect(a.destination);n.start()}catch(e){}}function load(){if(reload||ammo===2)return;reload=true;setTimeout(()=>{ammo=2;reload=false},850)}function shoot(px,py){if(!playing)return;if(ammo<=0){load();return}ammo--;shots++;flash=.08;shake=7;bang();let hit=null,qbest=9;for(let d of ducks){if(!d.alive)continue;let rx=38*d.s,ry=26*d.s,dx=px-d.x,dy=py-d.y,q=dx*dx/(rx*rx)+dy*dy/(ry*ry);if(q<1&&q<qbest){qbest=q;hit=d}}if(hit){hit.alive=0;kills++;for(let i=0;i<14;i++)parts.push({x:hit.x,y:hit.y,vx:R(-55,55),vy:R(-60,15),l:R(.3,.6)});setTimeout(spawn,350);if(kills>=10)finish()}if(ammo===0)setTimeout(load,250)}function finish(){playing=false;document.getElementById('es').textContent=shots;document.getElementById('ea').textContent=Math.round(100*kills/Math.max fff';x.fillText('SKUD',W-162,35);x.fillText('TRÆF',W-95,35);x.font='700 26px system-ui';x.fillText(shots,W-162,68);x.fillText(kills,W-95,68);x.font='700 19px system-ui';x.fillText(T(now-t0),18,H-22);rr(W-105,H-74,88,56,10);x.fillStyle='#0a0f12aa';x.fill();x.font='700 20px system-ui';x.fillStyle='#fff';x.fillText(reload?'…':ammo+' / 2',W-83,H-39)}function cross(){x.strokeStyle='#fffddd';x.lineWidth=1.4;x.beginPath();x.arc(aim.x,aim.y,10,0,7);x.moveTo(aim.x-19,aim.y);x.lineTo(aim.x-8,aim.y);x.moveTo(aim.x+19,aim.y);x.lineTo(aim.x+8,aim.y);x.moveTo(aim.x,aim.y-19);x.lineTo(aim.x,aim.y-8);x.moveTo(aim.x,aim.y+19);x.lineTo(aim.x,aim.y+8);x.stroke()}function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.032);last=now;x.clearRect(0,0,W,H);let sx=shake?R(-shake,shake):0,sy=shake?R(-shake,shake):0;shake*=.8;x.save();x.translate(sx,sy);bg();if(playing){for(let d of ducks)if(d.alive){d.p+=dt*8;d.x+=d.vx*dt;d.y+=d.vy*dt;if((d.vx>0&&d.x>W+90)||(d.vx<0&&d.x<-90)){d.x=d.vx>0?-80:W+80;d.y=R(H*.13,H*.55)}duck(d)}for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt;x.globalAlpha=Math.max(0,p.l*2);x.fillStyle='#e4dbc8';x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill()}x.globalAlpha=1;parts=parts.filter(p=>p.l>0);gun();hud(now);cross();if(flash>0){flash-=dt;x.fillStyle='#ffe7a6cc';x.beginPath();x.arc(W*.52,H*.5,R(20,48),0,7);x.fill()}}x.restore()}requestAnimationFrame(loop);c.addEventListener('pointermove',e=>{aim.x=e.clientX;aim.y=e.clientY});c.addEventListener('pointerdown',e=>{e.preventDefault();aim.x=e.clientX;aim.y=e.clientY;shoot(aim.x,aim.y)},{passive:false});function begin(e){e&&e.preventDefault();start.style.display='none';reset()}document.getElementById('go').addEventListener('click',begin);document.getElementById('go').addEventListener('touchstart',begin,{passive:false});document.getElementById('again').addEventListener('click',reset);document.getElementById('again').addEventListener('touchstart',e=>{e.preventDefault();reset()},{passive:false});</script></body></html>
