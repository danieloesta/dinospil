<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Morgenjagt</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1115;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none}*{box-sizing:border-box}#scene{position:fixed;inset:0;background:url('https://mir-s3-cdn-cf.behance.net/projects/808/c11f3e204137987.66a614465953d.png') center/cover no-repeat;transform:scale(1.02);transition:.08s}#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 43%,transparent 45%,#0006 100%);pointer-events:none}.hud{position:fixed;z-index:6;background:#10161acc;border:1px solid #ffffff45;border-radius:9px;backdrop-filter:blur(5px);box-shadow:0 3px 16px #0007}.label{font-size:12px;opacity:.88}.big{font-size:28px;font-weight:800;line-height:1.05;margin-top:3px}#goal{left:16px;top:16px;padding:10px 15px;min-width:140px}#ammo{right:124px;top:16px;padding:9px 12px}#score{right:16px;top:16px;padding:9px 13px;text-align:center;min-width:90px}.shells{display:flex;gap:7px;margin-top:5px}.shell{width:12px;height:29px;border-radius:3px;background:linear-gradient(#db3825 0 72%,#caa14e 72%);box-shadow:inset 0 0 0 1px #fff4}.shell.empty{filter:grayscale(1);opacity:.25}#reload,#pause{bottom:18px;padding:12px 18px;font-weight:750;font-size:15px;user-select:none}#reload{left:18px}#pause{right:18px}#cross{position:fixed;left:50%;top:44%;z-index:5;width:44px;height:44px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1px 2px #000)}#cross:before,#cross:after{content:'';position:absolute;background:#fff}#cross:before{left:21px;top:2px;width:2px;height:40px}#cross:after{top:21px;left:2px;height:2px;width:40px}#cross i{position:absolute;inset:11px;border:2px solid #fff;border-radius:50%}.duck{position:fixed;z-index:4;width:82px;height:48px;filter:drop-shadow(0 3px 4px #0009);cursor:crosshair;transform-origin:center}.duck svg{width:100%;height:100%}.duck.hit{animation:fall .7s ease-in forwards}@keyframes fall{to{transform:translateY(50vh) rotate(85deg) scale(.8);opacity:0}}.feather{position:fixed;z-index:8;width:5px;height:12px;background:#efe8d9;border-radius:60% 10% 60% 10%;animation:feather .8s ease-out forwards;pointer-events:none}@keyframes feather{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}#flash{position:fixed;z-index:3;left:55%;top:52%;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fffbd3,#ffc746 38%,transparent 72%);transform:translate(-50%,-50%) scale(0)}body.fire #flash{animation:muzzle .14s ease-out}body.fire #scene{transform:scale(1.04) translateY(5px);filter:brightness(1.12)}@keyframes muzzle{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(6);opacity:0}}#start,#end,#paused{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07101855,#071018df);backdrop-filter:blur(5px)}#end,#paused{display:none}.panel{width:min(420px,86vw);padding:24px;background:#10171ce8;border:1px solid #ffffff35;border-radius:18px;box-shadow:0 20px 60px #0009}h1{margin:0 0 8px;font-size:31px}p{margin:0 0 18px;line-height:1.45;opacity:.88}button{width:100%;padding:14px;border:0;border-radius:12px;background:#f2f0e8;color:#111;font-size:18px;font-weight:850}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.stat{background:#ffffff0e;padding:11px;border-radius:10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;opacity:.65}@media(max-width:700px){#ammo{right:104px}#goal{min-width:118px}.big{font-size:23px}.duck{width:68px;height:40px}}</style></head><body><div id="scene"></div><div id="shade"></div><div id="flash"></div><div id="goal" class="hud"><div class="label">MÅL</div><div class="big"><span id="kills">0</span> / 10</div></div><div id="ammo" class="hud"><div class="label">PATRONER</div><div class="shells"><i class="shell"></i><i class="shell"></i></div></div><div id="score" class="hud"><div class="label">SCORE</div><div class="big" id="scoreNum">0</div></div><div id="reload" class="hud">↻ GENLAD</div><div id="pause" class="hud">Ⅱ PAUSE</div><div id="cross"><i></i></div><div id="start"><div class="panel"><h1>Morgenjagt</h1><p>Skyd 10 ænder. To patroner ad gangen. Tryk direkte på en flyvende and for at skyde.</p><button id="go">START JAGTEN</button></div></div><div id="paused"><div class="panel"><h1>Pause</h1><p>Jagten er sat på pause.</p><button id="resume">FORTSÆT</button></div></div><div id="end"><div class="panel"><h1>Jagten er slut</h1><div class="stats"><div class="stat"><b id="sShots">0</b><span>SKUD</span></div><div class="stat"><b id="sAcc">0%</b><span>TRÆFPROCENT</span></div><div class="stat"><b id="sTime">00:00</b><span>TID</span></div><div class="stat"><b id="sScore">0</b><span>SCORE</span></div></div><button id="again">SPIL IGEN</button></div></div><script>const $=s=>document.querySelector(s),cross=$('#cross');let playing=false,paused=false,kills=0,shots=0,score=0,ammo=2,startTime=0,ducks=[];const shells=[...document.querySelectorAll('.shell')];function T(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function bang(){try{let A=window.AudioContext||window.webkitAudioContext,a=bang.a||(bang.a=new A),n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.18,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.03));n.buffer=b;let g=a.createGain();g.gain.value=.32;n.connect(g).connect(a.destination);n.start()}catch(e){}}function duckSVG(){return `<svg viewBox="0 0 110 62"><defs><linearGradient id="body" x1="0" x2="1"><stop stop-color="#9a876e"/><stop offset="1" stop-color="#4a5148"/></linearGradient><linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1a18a"/><stop offset="1" stop-color="#55594e"/></linearGradient></defs><ellipse cx="52" cy="36" rx="30" ry="14" fill="url(#body)"/><circle cx="83" cy="27" r="11" fill="#174a37"/><path d="M91 26h16l-15 6z" fill="#d1a14a"/><path d="M51 31Q41 2 72 5Q63 21 59 39z" fill="url(#wing)"/><path d="M51 39Q46 60 72 59Q60 45 58 35z" fill="#6c6c61"/><path d="M24 35L4 25l15 17z" fill="#444a43"/><circle cx="86" cy="24" r="1.8" fill="#fff"/><path d="M65 34h12" stroke="#fff" stroke-width="3"/></svg>`}function spawn(delay=0){setTimeout(()=>{if(!playing||paused||kills>=10)return;let d=document.createElement('div');d.className='duck';d.innerHTML=duckSVG();let dir=Math.random()<.5?1:-1,y=10+Math.random()*43,x=dir>0?-12:104,speed=5.5+Math.random()*4;d.style.top=y+'vh';d.style.left=x+'vw';if(dir<0)d.dataset.flip='1';document.body.appendChild(d);ducks.push(d);let born=performance.now();function fly(t){if(!d.isConnected)return;if(playing&&!paused&&!d.classList.contains('hit')){let p=(t-born)/(speed*1000),xx=dir>0?(-12+p*124):(104-p*124),yy=y+Math.sin(p*12)*2.3;d.style.left=xx+'vw';d.style.top=yy+'vh';d.style.transform=(dir<0?'scaleX(-1) ':'')+'rotate('+Math.sin(p*18)*4+'deg)';if(p>=1){d.remove();spawn(250+Math.random()*700);return}}requestAnimationFrame(fly)}requestAnimationFrame(fly);d.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();shoot(e.clientX,e.clientY,d)},{passive:false})},delay)}function hud(){$('#kills').textContent=kills;$('#scoreNum').textContent=score;shells.forEach((s,i)=>s.classList.toggle('empty',i>=ammo))}function feathers(x,y){for(let i=0;i<10;i++){let f=document.createElement('i');f.className='feather';f.style.left=x+'px';f.style.top=y+'px';f.style.setProperty('--dx',(Math.random()*150-75)+'px');f.style.setProperty('--dy',(Math.random()*130-30)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),850)}}function fire(){document.body.classList.remove('fire');void document.body.offsetWidth;document.body.classList.add('fire');setTimeout(()=>document.body.classList.remove('fire'),150);navigator.vibrate&&navigator.vibrate(18);bang()}function shoot(x,y,target){if(!playing||paused)return;if(ammo<=0){reload();return}ammo--;shots++;fire();hud();if(target&&!target.classList.contains('hit')){target.classList.add('hit');kills++;score+=100+ammo*20;feathers(x,y);hud();setTimeout(()=>target.remove(),700);if(kills>=10)setTimeout(finish,850);else spawn(300)}if(ammo===0)setTimeout(reload,400)}function reload(){if(!playing||paused||ammo===2)return;ammo=2;hud()}function finish(){playing=false;$('#sShots').textContent=shots;$('#sAcc').textContent=Math.round(kills/Math.max(1,shots)*100)+'%';$('#sTime').textContent=T(performance.now()-startTime);$('#sScore').textContent=score;$('#end').style.display='flex'}function reset(){ducks.forEach(d=>d.remove());ducks=[];kills=shots=score=0;ammo=2;playing=true;paused=false;startTime=performance.now();hud();$('#end').style.display='none';$('#paused').style.display='none';for(let i=0;i<4;i++)spawn(i*650)}$('#go').onclick=()=>{$('#start').style.display='none';reset()};$('#again').onclick=reset;$('#reload').onclick=reload;$('#pause').onclick=()=>{if(!playing)return;paused=true;$('#paused').style.display='flex'};$('#resume').onclick=()=>{paused=false;$('#paused').style.display='none'};addEventListener('pointermove',e=>{cross.style.left=e.clientX+'px';cross.style.top=e.clientY+'px'});addEventListener('pointerdown',e=>{if(e.target.closest('.duck,.hud,button,.panel'))return;cross.style.left=e.clientX+'px';cross.style.top=e.clientY+'px';shoot(e.clientX,e.clientY,null)});</script></body></html>
